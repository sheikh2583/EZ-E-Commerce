{% extends "base.html" %}
{% block title %}{{ title }} · Storefront{% endblock %}
{% block content %}
  <section class="page-section form-panel">
    <h1>{{ title }}</h1>
    <form method="post" class="stack">
      {% csrf_token %}
      {{ form.as_div }}
      <button class="button" type="submit">{{ submit }}</button>
    </form>
    {% block form_footer %}{% endblock %}
  </section>
{% endblock %}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ezcommerce
      POSTGRES_USER: ezcommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ezcommerce-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezcommerce -d ezcommerce"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  ezcommerce-data:

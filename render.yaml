# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: ez-e-commerce-demo
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: "off"
    buildCommand: ./scripts/build-web.sh
    preDeployCommand: ./scripts/release-web.sh
    startCommand: ./scripts/start-web.sh
    healthCheckPath: /readyz
    envVars:
      - fromGroup: ez-e-commerce-demo-config
      - key: DATABASE_URL
        fromDatabase:
          name: ez-e-commerce-demo-db
          property: connectionString

  - type: cron
    name: ez-e-commerce-demo-maintenance
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: "off"
    schedule: "*/5 * * * *"
    buildCommand: uv sync --locked --no-dev
    startCommand: ./scripts/maintenance.sh
    envVars:
      - fromGroup: ez-e-commerce-demo-config
      - key: DATABASE_URL
        fromDatabase:
          name: ez-e-commerce-demo-db
          property: connectionString

databases:
  - name: ez-e-commerce-demo-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 5
    ipAllowList: []

envVarGroups:
  - name: ez-e-commerce-demo-config
    envVars:
      - key: DJANGO_SECRET_SEED
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ez-e-commerce-demo.onrender.com
      - key: DJANGO_TRUST_HTTPS_PROXY
        value: "1"
      - key: DJANGO_FORWARDED_FOR_HOPS
        value: "1"
      - key: UV_VERSION
        value: "0.13.7"

[project]
name = "ez-e-commerce"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25,<26",
    "dj-database-url>=3,<4",
    "django>=5.2,<5.3",
    "gunicorn>=23,<27",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "whitenoise>=6,<7",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2,<6",
    "mypy>=1,<3",
    "playwright>=1,<2",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
ignore_missing_imports = true
exclude = "/migrations/"

[tool.django-stubs]
django_settings_module = "config.settings"
